name: Conciliar usuários/médicos duplicados (reparo)

# Executa em PRODUÇÃO, via SSH, as duas conciliações de usuários-médico:
#   1) usuarios:auditar-duplicados-legado  — funde par shell+@legado (mantém e-mail limpo + dados)
#   2) migration:audit-medico-links        — backfill/heurística de users.medico_id (liga médicos órfãos)
#
# DRY-RUN por padrão (não grava nada). Marque "force" para APLICAR de fato.
# Requer que o código já esteja deployado (os comandos precisam existir no servidor).

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Aplicar de fato (desmarcado = apenas simula / dry-run — NADA é gravado)"
        type: boolean
        required: false
        default: false

jobs:
  conciliar:
    runs-on: ubuntu-latest
    steps:
      - name: Rodar conciliações via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: IN_FORCE,APP_DIR
          command_timeout: "15m"
          script: |
            set -euo pipefail

            if [ -x /opt/alt/php84/usr/bin/php ]; then PHP=/opt/alt/php84/usr/bin/php;
            elif [ -x /usr/bin/php84 ]; then PHP=/usr/bin/php84;
            elif [ -x /usr/bin/php ]; then PHP=/usr/bin/php;
            else PHP=php; fi

            cd "$APP_DIR"
            echo "==> APP_DIR=$APP_DIR  PHP=$PHP ($($PHP -r 'echo PHP_VERSION;'))"
            echo "==> FORCE=$IN_FORCE"

            echo ""
            echo "############################################################"
            echo "# 1/2 — usuarios:auditar-duplicados-legado"
            echo "############################################################"
            if [ "$IN_FORCE" = "true" ]; then
              "$PHP" artisan usuarios:auditar-duplicados-legado --force
            else
              "$PHP" artisan usuarios:auditar-duplicados-legado
            fi

            echo ""
            echo "############################################################"
            echo "# 2/2 — migration:audit-medico-links"
            echo "############################################################"
            if [ "$IN_FORCE" = "true" ]; then
              "$PHP" artisan migration:audit-medico-links --fix
            else
              "$PHP" artisan migration:audit-medico-links
            fi

            echo ""
            echo "==> Conciliações concluídas (force=$IN_FORCE)."
        env:
          IN_FORCE: ${{ inputs.force }}
          APP_DIR: ${{ vars.HOSTINGER_REMOTE_PATH }}/revskin
