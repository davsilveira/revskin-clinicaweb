name: Diagnóstico prod (somente leitura)

# Lê estado do prod via SSH: últimas linhas do laravel.log, migrate:status, php about.
# NÃO altera nada. Disparo manual.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Coletar diagnóstico via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: APP_DIR
          command_timeout: "10m"
          script: |
            set -uo pipefail
            if [ -x /opt/alt/php84/usr/bin/php ]; then PHP=/opt/alt/php84/usr/bin/php;
            elif [ -x /usr/bin/php84 ]; then PHP=/usr/bin/php84;
            elif [ -x /usr/bin/php ]; then PHP=/usr/bin/php;
            else PHP=php; fi
            cd "$APP_DIR"
            echo "==> APP_DIR=$APP_DIR  PHP=$PHP ($($PHP -r 'echo PHP_VERSION;'))"

            echo ""; echo "===== migrate:status (últimas 30) ====="
            "$PHP" artisan migrate:status 2>&1 | tail -30 || true

            echo ""; echo "===== probe runtime: eager-load do pivot medico_paciente ====="
            "$PHP" artisan tinker --execute="try { \$p = App\Models\Paciente::with('medicos')->paginate(1); echo 'OK: paginate+medicos funcionou; total='.\$p->total().'; pivot_rows='.App\Models\MedicoPaciente::count().PHP_EOL; } catch (\Throwable \$e) { echo 'ERRO: '.get_class(\$e).': '.\$e->getMessage().PHP_EOL; }" 2>&1 | tail -5 || true

            echo ""; echo "===== CONSOLIDADOS (13 sobreviventes) id|name|email|medico_id ====="
            "$PHP" artisan tinker --execute="foreach ([281,282,283,284,285,286,288,289,290,291,292,293,296] as \$id) { \$u = App\Models\User::find(\$id); echo 'CONS|'.\$id.'|'.(\$u?\$u->name:'MISSING').'|'.(\$u?\$u->email:'-').'|medico_id='.(\$u?var_export(\$u->medico_id,true):'-').PHP_EOL; }" 2>&1 | grep -a '^CONS|' || true

            echo ""; echo "===== ORFAOS ATUAIS (role=medico, medico_id NULL) id|name|email ====="
            "$PHP" artisan tinker --execute="foreach (App\Models\User::where('role','medico')->whereNull('medico_id')->orderBy('id')->get() as \$u) { echo 'ORF|'.\$u->id.'|'.\$u->name.'|'.\$u->email.PHP_EOL; }" 2>&1 | grep -a '^ORF|' || true

            echo ""; echo "===== checagem #149 e #280 ====="
            "$PHP" artisan tinker --execute="foreach ([149,280] as \$id) { \$u=App\Models\User::find(\$id); echo 'CHK|'.\$id.'|'.(\$u?\$u->name.'|'.\$u->email.'|role='.\$u->role.'|medico_id='.var_export(\$u->medico_id,true):'INEXISTENTE').PHP_EOL; }" 2>&1 | grep -a '^CHK|' || true

            echo ""; echo "===== CONCILIAR Débora(186)/Angela(270): usuários-alvo ====="
            "$PHP" artisan tinker --execute="foreach ([186,270] as \$id) { \$u=App\Models\User::find(\$id); if(!\$u){ echo 'TGT|'.\$id.'|MISSING'.PHP_EOL; continue; } \$piv=DB::table('user_medico')->where('user_id',\$id)->pluck('medico_id')->implode(','); echo 'TGT|'.\$u->id.'|'.\$u->name.'|'.\$u->email.'|role='.\$u->role.'|medico_id='.var_export(\$u->medico_id,true).'|pivot='.\$piv.PHP_EOL; }" 2>&1 | grep -a '^TGT|' || true

            echo ""; echo "===== Medico candidatos p/ Débora (Bergami/Debora/Soares + email dbergami) ====="
            "$PHP" artisan tinker --execute="foreach (App\Models\Medico::query()->where(function(\$q){ foreach(['Bergami','Debora','Débora','Soares'] as \$t){ \$q->orWhere('apelido','like','%'.\$t.'%')->orWhere('nome_legado','like','%'.\$t.'%'); } \$q->orWhere('email1','like','%dbergami%')->orWhere('email2','like','%dbergami%')->orWhere('email1','like','%bergami%'); })->get() as \$m) { echo 'MEDDEB|'.\$m->id.'|apelido='.\$m->apelido.'|nome_legado='.\$m->nome_legado.'|crm='.\$m->crm.'|cpf='.\$m->cpf.'|email1='.\$m->email1.'|users='.App\Models\User::where('medico_id',\$m->id)->pluck('id')->implode(',').'|receitas='.DB::table('receitas')->where('medico_id',\$m->id)->count().'|pacientes='.DB::table('pacientes')->where('medico_id',\$m->id)->count().PHP_EOL; }" 2>&1 | grep -a '^MEDDEB|' || echo 'MEDDEB|NENHUM'

            echo ""; echo "===== Medico candidatos p/ Angela (Angela/Rodin/Rosin/Saad + email amaria) ====="
            "$PHP" artisan tinker --execute="foreach (App\Models\Medico::query()->where(function(\$q){ foreach(['Angela','Rodin','Rosin','Saad'] as \$t){ \$q->orWhere('apelido','like','%'.\$t.'%')->orWhere('nome_legado','like','%'.\$t.'%'); } \$q->orWhere('email1','like','%amaria%')->orWhere('email2','like','%amaria%'); })->get() as \$m) { echo 'MEDANG|'.\$m->id.'|apelido='.\$m->apelido.'|nome_legado='.\$m->nome_legado.'|crm='.\$m->crm.'|cpf='.\$m->cpf.'|email1='.\$m->email1.'|users='.App\Models\User::where('medico_id',\$m->id)->pluck('id')->implode(',').'|receitas='.DB::table('receitas')->where('medico_id',\$m->id)->count().'|pacientes='.DB::table('pacientes')->where('medico_id',\$m->id)->count().PHP_EOL; }" 2>&1 | grep -a '^MEDANG|' || echo 'MEDANG|NENHUM'

            echo ""; echo "===== Usuários possivelmente duplicados (Débora/Bergami e Angela/Saad/amaria) ====="
            "$PHP" artisan tinker --execute="foreach (App\Models\User::query()->where(function(\$q){ foreach(['Bergami','Débora','Debora','Angela','Saad','Rodin','Rosin'] as \$t){ \$q->orWhere('name','like','%'.\$t.'%'); } \$q->orWhere('email','like','%dbergami%')->orWhere('email','like','%amaria%'); })->orderBy('id')->get() as \$u) { echo 'DUP|'.\$u->id.'|'.\$u->name.'|'.\$u->email.'|role='.\$u->role.'|medico_id='.var_export(\$u->medico_id,true).PHP_EOL; }" 2>&1 | grep -a '^DUP|' || true

            echo ""; echo "===== Detalhe user #273 (linkado ao medico 929 da Angela) ====="
            "$PHP" artisan tinker --execute="\$u=App\Models\User::find(273); echo 'U273|'.(\$u?\$u->id.'|'.\$u->name.'|'.\$u->email.'|role='.\$u->role.'|medico_id='.var_export(\$u->medico_id,true):'INEXISTENTE').PHP_EOL;" 2>&1 | grep -a '^U273|' || true

            echo ""; echo "==> Diagnóstico concluído."
        env:
          APP_DIR: ${{ vars.HOSTINGER_REMOTE_PATH }}/revskin
