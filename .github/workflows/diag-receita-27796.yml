name: Diag receita 27796 (read-only)

# Investigação pontual: itens da receita 27796 / pedido Tiny 981442812 + logs.
# Somente leitura. Pode ser apagado depois.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar receita 27796 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: APP_DIR
          command_timeout: "10m"
          script: |
            set -uo pipefail
            if [ -x /opt/alt/php84/usr/bin/php ]; then PHP=/opt/alt/php84/usr/bin/php;
            elif [ -x /usr/bin/php84 ]; then PHP=/usr/bin/php84;
            elif [ -x /usr/bin/php ]; then PHP=/usr/bin/php;
            else PHP=php; fi
            cd "$APP_DIR"
            echo "==> APP_DIR=$APP_DIR PHP=$PHP"

            echo ""; echo "===== RECEITA 27796 ====="
            "$PHP" artisan tinker --execute="
            \$r = App\Models\Receita::with(['itens.produto','itens.aquisicoes','paciente:id,nome','medico'])->find(27796);
            if (!\$r) { echo 'R|NOT_FOUND'.PHP_EOL; return; }
            echo 'R|id='.\$r->id.'|numero='.\$r->numero.'|status='.\$r->status.'|tiny_pedido_id='.\$r->tiny_pedido_id.'|paciente='.(\$r->paciente->nome ?? '').'|created='.\$r->created_at.'|updated='.\$r->updated_at.PHP_EOL;
            echo 'R|obs='.substr((string)\$r->anotacoes,0,200).PHP_EOL;
            foreach (\$r->itens()->orderBy('ordem')->get() as \$i) {
              \$p = \$i->produto;
              \$aqs = \$i->aquisicoes->map(function(\$a){ return \$a->id.':'.\$a->data_aquisicao.'#tp='.\$a->tiny_pedido_id; })->implode(',');
              echo 'RI|id='.\$i->id.'|ordem='.\$i->ordem.'|produto_id='.\$i->produto_id.'|cod='.(\$p->codigo??'').'|nome='.(\$p->nome??'').'|tiny_id='.(\$p->tiny_id??'').'|qtd='.\$i->quantidade.'|vu='.\$i->valor_unitario.'|vt='.\$i->valor_total.'|vendido='.(\$i->vendido?1:0).'|imprimir='.(\$i->imprimir?1:0).'|grupo='.\$i->grupo.'|created='.\$i->created_at.'|updated='.\$i->updated_at.'|aq=['.\$aqs.']'.PHP_EOL;
            }
            " 2>&1 | grep -aE '^(R|RI)\|' || true

            echo ""; echo "===== Por tiny_pedido_id 981442812 ====="
            "$PHP" artisan tinker --execute="
            \$r = App\Models\Receita::where('tiny_pedido_id','981442812')->first();
            echo \$r ? 'TP|id='.\$r->id.'|numero='.\$r->numero.PHP_EOL : 'TP|NOT_FOUND'.PHP_EOL;
            " 2>&1 | grep -a '^TP|' || true

            echo ""; echo "===== Por numero 17483-0002 ====="
            "$PHP" artisan tinker --execute="
            foreach (App\Models\Receita::where('numero','like','17483%')->orderBy('id')->get(['id','numero','status','tiny_pedido_id','paciente_id']) as \$r) {
              echo 'N|id='.\$r->id.'|numero='.\$r->numero.'|status='.\$r->status.'|tiny='.\$r->tiny_pedido_id.PHP_EOL;
            }
            " 2>&1 | grep -a '^N|' || true

            echo ""; echo "===== Produtos DESINFLAM CLINDA 30G ====="
            "$PHP" artisan tinker --execute="
            foreach (App\Models\Produto::where('codigo','like','%DESINFLAM CLINDA 30G%')->orWhere('nome','like','%DESINFLAM CLINDA 30G%')->get(['id','codigo','nome','tiny_id','preco']) as \$p) {
              echo 'P|id='.\$p->id.'|cod='.\$p->codigo.'|nome='.\$p->nome.'|tiny_id='.\$p->tiny_id.'|preco='.\$p->preco.PHP_EOL;
            }
            " 2>&1 | grep -a '^P|' || true

            echo ""; echo "===== Count receita_itens DESINFLAM on 27796 ====="
            "$PHP" artisan tinker --execute="
            \$n = App\Models\ReceitaItem::where('receita_id',27796)->whereHas('produto', function(\$q){ \$q->where('codigo','like','%DESINFLAM CLINDA 30G%'); })->count();
            echo 'CNT|desinflam_lines='.\$n.PHP_EOL;
            \$dup = App\Models\ReceitaItem::where('receita_id',27796)->select('produto_id', DB::raw('count(*) as c'))->groupBy('produto_id')->having('c','>',1)->get();
            foreach (\$dup as \$d) { echo 'DUP|produto_id='.\$d->produto_id.'|count='.\$d->c.PHP_EOL; }
            " 2>&1 | grep -aE '^(CNT|DUP)\|' || true

            echo ""; echo "===== Logs webhook pedido 981442812 / receita 27796 ====="
            grep -aE '981442812|receita_id.: 27796|Receita #17483-0002|17483-0002' storage/logs/laravel.log 2>/dev/null | tail -80 || true

            echo ""; echo "===== Logs Merge/marcarItens (últimas 40 com 27796 ou 981442812) ====="
            grep -aE 'Merge de itens|marcarItensVendidos|linhas_novas|Processando webhook|Pedido obtido da API para merge' storage/logs/laravel.log 2>/dev/null | grep -aE '27796|981442812' | tail -40 || true

            echo ""; echo "===== Últimos merges Tiny (sem filtro, 20) ====="
            grep -a 'Merge de itens do pedido concluído' storage/logs/laravel.log 2>/dev/null | tail -20 || true

            echo ""; echo "==> Fim diag 27796."
        env:
          APP_DIR: ${{ vars.HOSTINGER_REMOTE_PATH }}/revskin
